<!DOCTYPE html>
<html lang="uk-UA">
    <head>
        <title>Форма входу</title>

        <meta name="charset" content="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">

        <link rel="stylesheet" href="./styles/sign-up.css">

        <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/1.0.0/sha256.min.js" defer></script>
        <script type="module" src="./scripts/log-in.js" defer></script>
    </head>
    <body>
        <main>
            <section class="sign-up">
                <form class="form" name="log-in" method="post" action="#" novalidate>
                    <fieldset class="form-fields">
                        <legend class="form-fields-legend">Персональна інформація</legend>

                        <label class="form-field">
                            <span class="form-field-text">Ім'я:</span>
                            <input class="form-field-input" type="text" name="first-name" autocomplete="off">
                            <span class="form-field-error" data-field-error></span>
                        </label>

                        <label class="form-field">
                            <span class="form-field-text">Прізвище:</span>
                            <input class="form-field-input" type="text" name="last-name" autocomplete="off">
                            <span class="form-field-error" data-field-error></span>
                        </label>

                        <div class="form-password">
                            <label class="form-field">
                                <span class="form-field-text">Пароль:</span>
                                <input class="form-field-input form-password-field-input number" type="password" name="password" autocomplete="on">
                                <span class="form-field-error" data-field-error></span>
                            </label>

                            <label class="form-password-visibility-field">
                                <input type="checkbox" name="password-visibility" autocomplete="off">
                                <span>Показати пароль</span>
                            </label>
                        </div>
                    </fieldset>

                    <button class="form-submit" type="submit">Увійти</button>
                    <p class="sign-up-message">або зареєструватись по <a href="/sign-up">цьому</a> посиланню</p>
                </form>
            </section>
        </main>
    </body>
</html>
