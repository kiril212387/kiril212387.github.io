<!DOCTYPE html>
<html lang="uk-UA">
    <head>
        <title>Форма реєстрації</title>

        <meta name="charset" content="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">

        <link rel="stylesheet" href="/styles/variables.css">
        <link rel="stylesheet" href="/styles/fonts.css">
        <link rel="stylesheet" href="/styles/base.css">

        <link rel="stylesheet" href="/styles/sign-in.css">

        <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/1.0.0/sha256.min.js"></script>
        <script src="/scripts/sign-in.js" defer></script>
    </head>
    <body>
        <main>
            <section class="sign-in">
                <form class="sign-in-form" name="sign-in" method="post" action="#">
                    <fieldset class="sign-in-form-fields">
                        <legend class="sign-in-form-fields-legend">Персональна інформація</legend>

                        <label class="sign-in-form-field">
                            <span class="sign-in-form-field-text">Ім'я:</span>
                            <input class="sign-in-form-field-input" type="text" name="first-name" autocomplete="off" minlength="2" maxlength="34" required>
                        </label>

                        <label class="sign-in-form-field">
                            <span class="sign-in-form-field-text">Прізвище:</span>
                            <input class="sign-in-form-field-input" type="text" name="last-name" minlength="2" maxlength="34" autocomplete="off" required>
                        </label>

                        <label class="sign-in-form-field">
                            <span class="sign-in-form-field-text">Електронна пошта:</span>
                            <input class="sign-in-form-field-input" type="email" name="email" autocomplete="on" required>
                        </label>

                        <div class="sign-in-form-password">
                            <label class="sign-in-form-field">
                                <span class="sign-in-form-field-text">Пароль:</span>
                                <input class="sign-in-form-field-input sign-in-form-password-field-input" type="password" name="password" pattern="\w*" autocomplete="yes" minlength="8" maxlength="36" required>
                            </label>

                            <label class="sign-in-form-password-visibility-field">
                                <input type="checkbox" name="password-visibility">
                                <span>Показати пароль</span>
                            </label>
                        </div>
                    </fieldset>

                    <button class="sign-in-form-submit" type="submit">Зареєструватись</button>
                </form>
            </section>
        </main>
    </body>
</html>
