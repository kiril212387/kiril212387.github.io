<!DOCTYPE html>
<html>
    <head>
        <title>Форма реєстрації</title>

        <meta name="charset" content="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">

        <link rel="stylesheet" href="/styles/fonts.css">
        <link rel="stylesheet" href="/styles/base.css">

        <link rel="stylesheet" href="/styles/sign-in.css">

        <script src="/scripts/sign-in.js" defer></script>
    </head>
    <body>
        <section class="sign-in">
            <form class="sign-in-form" name="sign-in" method="post" action="#">
                <fieldset class="sign-in-form-fields">
                    <legend class="sign-in-form-fields-legend">Персональна інформація</legend>

                    <label class="sign-in-form-field">
                        <span class="sign-in-form-field-text">Ім'я:</span>
                        <input class="sign-in-form-field-input" type="text" name="first-name" required>
                    </label>

                    <label class="sign-in-form-field">
                        <span class="sign-in-form-field-text">Прізвище:</span>
                        <input class="sign-in-form-field-input" type="text" name="last-name" required>
                    </label>

                    <label class="sign-in-form-field">
                        <span class="sign-in-form-field-text">Електрона пошта:</span>
                        <input class="sign-in-form-field-input" type="email" name="email" required>
                    </label>

                    <div class="sign-in-form-password">
                        <label class="sign-in-form-field">
                            <span class="sign-in-form-field-text">Пароль:</span>
                            <input class="sign-in-form-field-input" type="password" name="password" minlength="8" required>
                        </label>

                        <label class="sign-in-form-password-visibility-field">
                            <input type="checkbox" name="password-visibility" autocomplete="off">
                            <span>Показати пароль</span>
                        </label>
                    </div>
                </fieldset>

                <button class="sign-in-form-submit" type="submit">Зареєструватись</button>
            </form>
        </section>
    </body>
</html>
